components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - current_password
      - new_password
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender:
          type: integer
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        receiver:
          type: integer
        receiver_name:
          type: string
          readOnly: true
        receiver_username:
          type: string
          writeOnly: true
        message:
          type: string
        is_read:
          type: boolean
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - message
      - receiver
      - receiver_name
      - sender
      - sender_name
      - timestamp
    Collaboration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        user:
          type: integer
        username:
          type: string
          readOnly: true
        role:
          type: string
          maxLength: 50
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - joined_at
      - project
      - role
      - user
      - username
    ConnectionRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender:
          type: integer
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        receiver:
          type: integer
        receiver_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - receiver
      - receiver_name
      - sender
      - sender_name
      - status
    ForgotPassword:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    Invitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        project_name:
          type: string
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        receiver:
          type: integer
        status:
          type: string
          maxLength: 20
        sent_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - project
      - project_name
      - receiver
      - sender_name
      - sent_at
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender:
          type: integer
        sender_name:
          type: string
          readOnly: true
        receiver:
          type: integer
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        post:
          type: integer
          nullable: true
        project:
          type: integer
          nullable: true
        invitation:
          type: integer
          nullable: true
        connection_request:
          type: integer
          nullable: true
        message:
          type: string
          maxLength: 255
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - receiver
      - sender
      - sender_name
    NotificationTypeEnum:
      enum:
      - FOLLOW
      - LIKE
      - COMMENT
      - CONNECTION_REQUEST
      - COLLAB_INVITATION
      - TAG
      - ACCEPT_COLLAB
      - ACCEPT_CONNECTION
      - INTERESTED
      type: string
      description: |-
        * `FOLLOW` - New Follower
        * `LIKE` - Post Like
        * `COMMENT` - Post Comment
        * `CONNECTION_REQUEST` - Connection Request
        * `COLLAB_INVITATION` - Collaboration Invitation
        * `TAG` - User Tag
        * `ACCEPT_COLLAB` - Collaboration Accepted
        * `ACCEPT_CONNECTION` - Connection Accepted
        * `INTERESTED` - Project Interest
